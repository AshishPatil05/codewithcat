{% extends "base.html" %}
{% block title %}Sign Up - Code With Cat{% endblock title %}

{% block body %}
<style>
  .auth-section{
    min-height:80vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:50px 8%;
    background:#fffaf3;
  }

  .auth-card{
    width:100%;
    max-width:430px;
    background:#ffffff;
    border-radius:18px;
    box-shadow:0 10px 28px rgba(0,0,0,0.10);
    padding:34px;
  }

  .auth-card h1{
    font-size:36px;
    text-align:center;
    color:#111827;
    margin-bottom:10px;
  }

  .auth-card p{
    text-align:center;
    color:#6b7280;
    margin-bottom:28px;
  }

  .form-group{
    margin-bottom:18px;
  }

  .form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:700;
    color:#374151;
  }

  .form-group input{
    width:100%;
    padding:13px 14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    outline:none;
    font-size:15px;
    transition:0.3s;
  }

  .form-group input:focus{
    border-color:#f59e0b;
    box-shadow:0 0 0 3px rgba(245,158,11,0.16);
  }

  .auth-btn{
    width:100%;
    padding:13px 18px;
    background:#f59e0b;
    color:#ffffff;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
  }

  .auth-btn:hover{
    background:#d97706;
  }

  .auth-links{
    margin-top:18px;
    text-align:center;
    color:#6b7280;
  }

  .auth-links a{
    color:#f59e0b;
    text-decoration:none;
    font-weight:700;
  }

  .auth-links a:hover{
    text-decoration:underline;
  }

  .error-box{
    background:#fef2f2;
    color:#b91c1c;
    border:1px solid #fecaca;
    padding:10px 12px;
    border-radius:10px;
    margin-bottom:16px;
    font-size:14px;
  }

  @media(max-width:480px){
    .auth-card{
      padding:24px;
    }

    .auth-card h1{
      font-size:30px;
    }
  }
</style>

<section class="auth-section">
  <div class="auth-card">
    <h1>Sign Up</h1>
    <p>Create your Code With Cat account</p>

    {% if form.errors %}
      <div class="error-box">Please check your details and try again.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="id_username">Username</label>
        <input type="text" name="username" id="id_username" required>
      </div>

      <div class="form-group">
        <label for="id_password1">Password</label>
        <input type="password" name="password1" id="id_password1" required>
      </div>

      <div class="form-group">
        <label for="id_password2">Confirm Password</label>
        <input type="password" name="password2" id="id_password2" required>
      </div>

      <button type="submit" class="auth-btn">Sign Up</button>
    </form>

    <div class="auth-links">
      Already have an account? <a href="{% url 'login' %}">Login</a>
    </div>
  </div>
</section>
{% endblock body %}
