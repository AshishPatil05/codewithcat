{% extends "base.html" %}
{% block title %}Add Note - Code With Cat{% endblock title %}

{% block body %}
<style>
  .form-hero{
    padding:70px 8% 20px;
    text-align:center;
  }

  .form-hero h1{
    font-size:46px;
    color:#111827;
    margin-bottom:12px;
  }

  .form-hero p{
    color:#6b7280;
    font-size:18px;
    max-width:720px;
    margin:0 auto;
  }

  .form-wrap{
    padding:20px 8% 60px;
  }

  .form-card{
    background:#ffffff;
    max-width:760px;
    margin:auto;
    padding:34px;
    border-radius:18px;
    box-shadow:0 10px 28px rgba(0,0,0,0.08);
  }

  .form-card input,
  .form-card textarea{
    width:100%;
    padding:14px;
    margin-top:10px;
    margin-bottom:18px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
    outline:none;
  }

  .form-card textarea{
    min-height:160px;
    resize:vertical;
  }

  .form-card input:focus,
  .form-card textarea:focus{
    border-color:#f59e0b;
    box-shadow:0 0 0 3px rgba(245,158,11,0.15);
  }

  .file-note{
    display:block;
    margin:8px 0 18px;
    color:#6b7280;
    font-size:14px;
  }
</style>

<section class="form-hero">
  <h1>Add Note</h1>
  <p>Create a new note with optional photo upload.</p>
</section>

<section class="form-wrap">
  <div class="form-card">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <input type="text" name="title" placeholder="Title" required>
      <textarea name="description" placeholder="Description" required></textarea>
      <input type="file" name="image" accept="image/*">
      <span class="file-note">You can upload a photo for this note.</span>
      <button type="submit" class="btn">Save Note</button>
    </form>
  </div>
</section>
{% endblock body %}
