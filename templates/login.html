{% extends "base.html" %}
{% block title %}Login - Code With Cat{% endblock title %}

{% block body %}
<section style="min-height:80vh; display:flex; align-items:center; justify-content:center; padding:50px 8%; background:#fffaf3;">
  <div style="width:100%; max-width:430px; background:#ffffff; border-radius:18px; box-shadow:0 10px 28px rgba(0,0,0,0.10); padding:34px;">
    <h1 style="font-size:36px; text-align:center; color:#111827; margin-bottom:10px;">Login</h1>
    <p style="text-align:center; color:#6b7280; margin-bottom:28px;">Welcome back to Code With Cat</p>

    {% if form.errors %}
      <div style="background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; padding:10px 12px; border-radius:10px; margin-bottom:16px; font-size:14px;">
        Invalid username or password.
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div style="margin-bottom:18px;">
        <label for="id_username" style="display:block; margin-bottom:8px; font-weight:700; color:#374151;">Username</label>
        <input type="text" name="username" id="id_username" required style="width:100%; padding:13px 14px; border:1px solid #d1d5db; border-radius:10px; outline:none; font-size:15px;">
      </div>

      <div style="margin-bottom:18px;">
        <label for="id_password" style="display:block; margin-bottom:8px; font-weight:700; color:#374151;">Password</label>
        <input type="password" name="password" id="id_password" required style="width:100%; padding:13px 14px; border:1px solid #d1d5db; border-radius:10px; outline:none; font-size:15px;">
      </div>

      <button type="submit" style="width:100%; padding:13px 18px; background:#f59e0b; color:#ffffff; border:none; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer;">Login</button>
    </form>

    <div style="margin-top:18px; text-align:center; color:#6b7280;">
      Don’t have an account? <a href="{% url 'signup' %}" style="color:#f59e0b; text-decoration:none; font-weight:700;">Sign up</a>
    </div>
  </div>
</section>
{% endblock body %}
