<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Code With Cat{% endblock title %}</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#fffaf3;
      color:#222;
      line-height:1.6;
    }

    .navbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:18px 8%;
      background:#1f2937;
      color:white;
      position:sticky;
      top:0;
      z-index:1000;
      flex-wrap:wrap;
      gap:15px;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      color:#f59e0b;
      text-decoration:none;
    }

    .nav-links{
      display:flex;
      list-style:none;
      gap:20px;
      flex-wrap:wrap;
      align-items:center;
    }

    .nav-links a{
      color:white;
      text-decoration:none;
      font-size:16px;
      transition:0.3s;
    }

    .nav-links a:hover,
    .nav-links a.active{
      color:#f59e0b;
    }

    .btn{
      background:#f59e0b;
      color:white;
      padding:10px 18px;
      border:none;
      border-radius:8px;
      text-decoration:none;
      transition:0.3s;
      display:inline-block;
    }

    .btn:hover{
      background:#d97706;
    }

    .auth-btn{
      background:#f59e0b;
      color:#fff !important;
      padding:10px 16px;
      border-radius:8px;
      text-decoration:none;
      transition:0.3s;
      border:none;
      cursor:pointer;
      font-size:16px;
      font-family:inherit;
    }

    .auth-btn:hover{
      background:#d97706;
      color:#fff !important;
    }

    .auth-form{
      display:inline;
    }

    .footer{
      text-align:center;
      padding:25px;
      background:#1f2937;
      color:white;
      margin-top:40px;
    }

    @media(max-width:768px){
      .navbar{
        flex-direction:column;
        text-align:center;
      }

      .nav-links{
        justify-content:center;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="{% url 'home' %}" class="logo">😼 Code With Cat</a>

    <ul class="nav-links">
      <li><a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a></li>
      <li><a href="{% url 'course' %}" class="{% if request.resolver_match.url_name == 'course' %}active{% endif %}">Courses</a></li>
      <li><a href="{% url 'notes' %}" class="{% if request.resolver_match.url_name == 'notes' %}active{% endif %}">Notes</a></li>
      <li><a href="{% url 'aboutus' %}" class="{% if request.resolver_match.url_name == 'aboutus' %}active{% endif %}">About us</a></li>
      <li><a href="{% url 'contact' %}" class="{% if request.resolver_match.url_name == 'contact' %}active{% endif %}">Contact</a></li>

      {% if user.is_authenticated %}
  <li>
    <form action="{% url 'logout' %}" method="post" class="auth-form">
      {% csrf_token %}
      <button type="submit" class="auth-btn">Logout</button>
    </form>
  </li>
{% else %}
  <li><a href="{% url 'login' %}" class="auth-btn">Login</a></li>
  <li><a href="{% url 'signup' %}" class="auth-btn">Sign Up</a></li>
{% endif %}
    </ul>

    <a href="{% url 'notes' %}" class="btn">Start Learning</a>
  </nav>

  {% block body %}{% endblock body %}

  <footer class="footer">
    <p>© 2026 Code With Cat</p>
  </footer>

</body>
</html>
