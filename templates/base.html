<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Code With Cat{% endblock title %}</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#fffaf3;
      color:#222;
      line-height:1.6;
    }

    .navbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:18px 8%;
      background:#1f2937;
      color:white;
      position:sticky;
      top:0;
      z-index:1000;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      color:#f59e0b;
      text-decoration:none;
    }

    .nav-links{
      display:flex;
      list-style:none;
      gap:20px;
      align-items:center;
    }

    .nav-links a{
      color:white;
      text-decoration:none;
      font-size:16px;
      transition:0.3s;
    }

    .nav-links a:hover{
      color:#f59e0b;
    }

    .btn{
      background:#f59e0b;
      color:white;
      padding:10px 18px;
      border:none;
      border-radius:8px;
      text-decoration:none;
      transition:0.3s;
      display:inline-block;
    }

    .btn:hover{
      background:#d97706;
    }

    .hero{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:80px 8%;
      flex-wrap:wrap;
    }

    .hero-text{
      max-width:550px;
    }

    .hero-text h1{
      font-size:52px;
      margin-bottom:20px;
      color:#111827;
    }

    .hero-text p{
      font-size:18px;
      margin-bottom:25px;
      color:#4b5563;
    }

    .hero-img{
      font-size:120px;
    }

    .courses{
      padding:60px 8%;
    }

    .courses h2{
      text-align:center;
      font-size:36px;
      margin-bottom:40px;
    }

    .course-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:25px;
    }

    .card{
      background:white;
      padding:25px;
      border-radius:16px;
      box-shadow:0 6px 18px rgba(0,0,0,0.08);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-8px);
    }

    .card h3{
      margin-bottom:10px;
      color:#111827;
    }

    .card p{
      color:#6b7280;
    }

    .footer{
      text-align:center;
      padding:25px;
      background:#1f2937;
      color:white;
      margin-top:40px;
    }

    @media(max-width:768px){
      .navbar{
        flex-direction:column;
        gap:15px;
      }

      .nav-links{
        flex-direction:column;
        gap:10px;
      }

      .hero{
        text-align:center;
        justify-content:center;
      }

      .hero-text h1{
        font-size:38px;
      }

      .hero-img{
        margin-top:30px;
        font-size:90px;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="{% url 'home' %}" class="logo">😼 Code With Cat</a>

    <ul class="nav-links">
      <li><a href="{% url 'home' %}">Home</a></li>
      <li><a href="/course">Courses</a></li>
      <li><a href="/notes">Notes</a></li>
      <li><a href="/aboutus">About us</a></li>
      <li><a href="/contact">Contact</a></li>

      {% comment %} {% if user.is_authenticated %}
        <li><a href="{% url 'logout' %}">Logout</a></li>
      {% else %} {% endcomment %}
        <li><a href="{% url 'login' %}">Login</a></li>
      {% comment %} {% endif %} {% endcomment %}
    </ul>

    <a href="/notes" class="btn">Start Learning</a>
  </nav>

  {% block body %}{% endblock body %}

</body>
</html>
