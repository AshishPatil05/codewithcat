{% extends "base.html" %}
{% block title %}Delete Note - Code With Cat{% endblock title %}

{% block body %}
<style>
  .del-wrap{
    padding:80px 8%;
  }

  .del-card{
    background:#ffffff;
    max-width:700px;
    margin:auto;
    padding:34px;
    border-radius:18px;
    box-shadow:0 10px 28px rgba(0,0,0,0.08);
    text-align:center;
  }

  .del-card h1{
    font-size:40px;
    color:#111827;
    margin-bottom:14px;
  }

  .del-card p{
    color:#6b7280;
    margin-bottom:20px;
  }

  .del-img{
    max-width:100%;
    max-height:220px;
    object-fit:cover;
    border-radius:14px;
    margin:18px 0;
  }

  .del-actions{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:20px;
  }

  .danger-btn{
    background:#ef4444;
    color:#fff;
    border:none;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
  }

  .cancel-btn{
    background:#6b7280;
    color:#fff;
    padding:12px 18px;
    border-radius:10px;
    text-decoration:none;
    display:inline-block;
  }
</style>

<section class="del-wrap">
  <div class="del-card">
    <h1>Delete Note</h1>
    <p>Are you sure you want to delete this note?</p>

    {% if note.image %}
      <img src="{{ note.image.url }}" class="del-img" alt="{{ note.title }}">
    {% endif %}

    <h3 style="margin-bottom:10px;">{{ note.title }}</h3>
    <p>{{ note.description }}</p>

    <form method="post">
      {% csrf_token %}
      <div class="del-actions">
        <button type="submit" class="danger-btn">Delete</button>
        <a href="{% url 'notes' %}" class="cancel-btn">Cancel</a>
      </div>
    </form>
  </div>
</section>
{% endblock body %}
